<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 620" role="img" aria-labelledby="title desc">
    <title id="title">Swarajya Construction Pvt. Ltd. logo</title>
    <desc id="desc">Octagonal Swarajya Construction Pvt. Ltd. logo with Marathi and English text.</desc>
    <defs>
        <linearGradient id="edge" x1="135" y1="62" x2="485" y2="558" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#d7682d"/>
            <stop offset="0.55" stop-color="#9d3c30"/>
            <stop offset="1" stop-color="#68201d"/>
        </linearGradient>
        <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
            <feGaussianBlur in="SourceAlpha" stdDeviation="2.4"/>
            <feOffset dx="0" dy="2"/>
            <feComposite in2="SourceAlpha" operator="out"/>
            <feColorMatrix values="0 0 0 0 0.30 0 0 0 0 0.08 0 0 0 0 0.06 0 0 0 0.38 0"/>
            <feBlend in2="SourceGraphic" mode="normal"/>
        </filter>
        <filter id="textShadow" x="-10%" y="-20%" width="120%" height="150%">
            <feDropShadow dx="7" dy="7" stdDeviation="0" flood-color="#f0a081" flood-opacity="0.9"/>
        </filter>
    </defs>
    <rect width="620" height="620" fill="#ffffff"/>
    <g filter="url(#soft)">
        <polygon points="188,30 432,30 590,188 590,432 432,590 188,590 30,432 30,188"
            fill="none" stroke="url(#edge)" stroke-width="56" stroke-linejoin="round" stroke-linecap="round"/>
        <polygon points="205,86 415,86 534,205 534,415 415,534 205,534 86,415 86,205"
            fill="none" stroke="#ffffff" stroke-width="20" stroke-linejoin="round" stroke-linecap="round"/>
        <polygon points="214,101 406,101 519,214 519,406 406,519 214,519 101,406 101,214"
            fill="none" stroke="url(#edge)" stroke-width="9" stroke-linejoin="round" stroke-linecap="round"/>
    </g>
    <g fill="#dd4b16" filter="url(#textShadow)" text-anchor="middle">
        <text x="310" y="276"
            font-family="Nirmala UI, Mangal, Kokila, Arial Unicode MS, sans-serif"
            font-size="100"
            font-weight="800"
            letter-spacing="0">स्वराज्य</text>
        <text x="310" y="374"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="50"
            font-weight="600"
            letter-spacing="2">CONSTRUCTION</text>
        <text x="310" y="438"
            font-family="Georgia, 'Times New Roman', serif"
            font-size="49"
            font-weight="600"
            letter-spacing="2">PVT. LTD.</text>
    </g>
</svg>
